name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install · Lint · Typecheck · Unit · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mudrax
          POSTGRES_PASSWORD: mudrax_ci_password
          POSTGRES_DB: mudrax_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudrax -d mudrax_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mudrax:mudrax_ci_password@localhost:5432/mudrax_crm?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-not-for-production-use-32chars
      AUTH_URL: http://127.0.0.1:3015
      AUTH_TRUST_HOST: "true"
      APP_URL: http://127.0.0.1:3015
      JOBS_ENABLED: "false"
      JOBS_INLINE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            package.json
            package-lock.json
            prisma
            prisma.config.ts
            next.config.ts
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mudrax
          POSTGRES_PASSWORD: mudrax_ci_password
          POSTGRES_DB: mudrax_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mudrax -d mudrax_crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://mudrax:mudrax_ci_password@localhost:5432/mudrax_crm?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-not-for-production-use-32chars
      AUTH_URL: http://127.0.0.1:3015
      AUTH_TRUST_HOST: "true"
      APP_URL: http://127.0.0.1:3015
      E2E_PORT: "3015"
      JOBS_ENABLED: "false"
      JOBS_INLINE: "false"
      E2E_ADMIN_EMAIL: aarush.taluja1@gmail.com
      E2E_ADMIN_PASSWORD: Sairam@123
      E2E_DEMO_PASSWORD: Mudrax@User2026!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate + migrate + seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E webServer
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_WEB_COMMAND: npm run start -- --port 3015

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
