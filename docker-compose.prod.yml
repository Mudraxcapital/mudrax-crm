# ============================================================================
# Mudrax CRM — production Docker Compose
#
# One Next.js app (ADR 0001) + Postgres + Redis + optional jobs worker.
# Copy deploy/env/.env.production.example to .env.production and fill secrets.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ============================================================================

networks:
  mudrax-network:
    name: mudrax-crm-prod-network
    driver: bridge

volumes:
  postgres-data:
    name: mudrax-crm-prod-postgres-data
  redis-data:
    name: mudrax-crm-prod-redis-data
  app-data:
    name: mudrax-crm-prod-app-data

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mudrax-crm-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JOBS_INLINE: "false"
      JOBS_ENABLED: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/live || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mudrax-network

  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mudrax-crm-jobs
    restart: unless-stopped
    command: ["npm", "run", "jobs:worker"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JOBS_ENABLED: "true"
      JOBS_KEEP_ALIVE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mudrax-network

  postgres:
    image: postgres:16-alpine
    container_name: mudrax-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mudrax-network

  redis:
    image: redis:7-alpine
    container_name: mudrax-crm-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mudrax-network
